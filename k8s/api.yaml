# Sesión 07 (reto): la API en Kubernetes. Cambia TU_USUARIO y la versión.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: TU_USUARIO/api:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: CORS_ORIGIN
              value: "http://localhost:8080"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
